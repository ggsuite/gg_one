name: gg_one
description: The convenient dart & flutter developer command line, bundling the gg_one tool family into one CLI.
version: 14.4.2
repository: https://github.com/ggsuite/gg_one.git

environment:
  sdk: ">=3.13.0 <4.0.0"

dependencies:
  args: ^2.7.0
  gg_args: ^3.2.0
  gg_console_colors: ^2.5.0
  gg_git: ^4.4.1
  gg_lang: ^0.8.0
  gg_log: ^1.2.0
  gg_one_commit: ^2.6.1
  gg_one_core: ^2.8.0
  gg_one_do_publish: ^2.8.1
  gg_one_merge: ^2.6.3
  gg_process: ^1.3.0
  path: ^1.9.1

dev_dependencies:
  dna_ggsuite: ^0.2.1
  gg_capture_print: ^1.2.0
  helix: ^1.7.1
  lints: ^6.1.0
  recase: ^4.1.0
  test: ^1.32.0

executables:
  gg_one: