name: gg_one
description: A collection of checks and actions like analyzing, linting, testing, code coverage, committing, pushing, publishing.
version: 12.9.0
repository: https://github.com/ggsuite/gg_one.git

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  args: ^2.7.0
  gg_args: ^2.2.0
  gg_console_colors: ^2.3.0
  gg_git: ^3.2.2
  gg_is_flutter: ^1.0.7
  gg_lang: ^0.4.0
  gg_log: ^1.0.6
  gg_process: ^1.1.6
  gg_publish: ^3.10.2
  gg_status_printer: ^1.4.2

  gg_test: ^2.4.0
  gg_version: ^4.6.1
  meta: ^1.19.0

  mocktail: ^1.0.5
  path: ^1.9.1
  pub_semver: ^2.2.0
  yaml: ^3.1.3
  # HasVersion and the changelog sort were added in 1.2.0. gg_changelog must
  # be published with a »minor« increment, otherwise this constraint cannot
  # be satisfied.
  gg_changelog: ^1.1.5
  gg_is_github: ^1.0.6
  matcher: ^0.12.20
  gg_direct_json: ^2.0.1
  gg_merge: ^2.1.1
  gg_one_checks: ^1.0.0
  gg_one_state: ^1.0.0
  interact: ^2.2.0

dev_dependencies:
  gg_capture_print: ^1.0.9
  lints: ^6.1.0
  recase: ^4.1.0
  test: ^1.31.2

executables:
  gg_one: