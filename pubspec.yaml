version: 14.1.2
repository: https://github.com/ggsuite/gg_one.git

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  args: ^2.7.0
  gg_args: ^3.0.0
  gg_console_colors: ^2.3.0
  gg_git: ^4.1.1
