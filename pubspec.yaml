name: gg_one
description: The convenient dart & flutter developer command line, bundling the gg_one tool family into one CLI.
version: 14.2.1
repository: https://github.com/ggsuite/gg_one.git

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  args: ^2.7.0
  gg_args: ^3.0.1
  gg_console_colors: ^2.3.1
  gg_git: ^4.1.2
  gg_lang: ^0.5.1
  gg_log: ^1.0.7
  gg_one_commit: ^2.2.3
  gg_one_core: ^2.4.1
  gg_one_do_publish: ^2.5.1
  gg_one_merge: ^2.4.1
  gg_process: ^1.1.7
  path: ^1.9.1

dev_dependencies:
  gg_capture_print: ^1.0.10
  lints: ^6.1.0
  recase: ^4.1.0
  test: ^1.31.2

